<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
</head>
<body>

  <h2>Contact Us</h2>

  <form id="contactForm">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <input type="email" id="email" placeholder="Your Email" required><br><br>
    <textarea id="message" placeholder="Your Message" required></textarea><br><br>
    <button type="submit">Send</button>
  </form>

  <p id="response"></p>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      console.log("Form submitted ✅");

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      };

      try {

  const res = await fetch("https://contact-form-api-production-2c85.up.railway.app/api/contact", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (!res.ok) {
    throw new Error(result.error || "Server error");
  }

  document.getElementById("response").innerText = result.message;

} catch (error) {

  console.error("ERROR:", error);

  document.getElementById("response").innerText = "Failed to send message ❌";

}
});
</script>

</body>
</html>
